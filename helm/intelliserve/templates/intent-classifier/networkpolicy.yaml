apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intent-allow-gateway-only
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: intent            
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway 
{{- if .Values.prometheus.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.prometheus.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.prometheus.podLabels | nindent 14 }}
      ports:
        - port: {{ .Values.prometheus.port }}
{{- end }} 
              