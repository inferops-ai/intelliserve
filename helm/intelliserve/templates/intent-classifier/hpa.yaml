apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: intent-hpa
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: intent-deployment
  minReplicas: {{ .Values.minReplicas }}
  maxReplicas: {{ .Values.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: {{ .Values.target.type }}
        averageUtilization: {{ .Values.target.averageUtilization }}