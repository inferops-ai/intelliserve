apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-apigateway
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - {{ .Values.hostname }}
  rules:
  - matches:
    - path:
        type: Exact
        value: {{ .Values.gatewayAPI.path }}
    backendRefs:
    - name: gateway-service
      port: {{ .Values.gatewayAPI.port }}
    filters:
      - type: ExtensionRef
        extensionRef:
          group: gateway.nginx.org
          kind: SnippetsFilter
          name: proxy-timeouts