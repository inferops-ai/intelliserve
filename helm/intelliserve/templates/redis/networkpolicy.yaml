apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-gateway-only
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: redis            
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway  