apiVersion: apps/v1
kind: Deployment 
metadata:
  name: gateway-deployment
  namespace: intelliserve
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: api-gateway-api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80