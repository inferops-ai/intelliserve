apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: intelliserve
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:latest 
        ports:
        - containerPort: 6379
        readinessProbe:
          exec:
            command:
              - redis-cli 
              - ping
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
              - redis-cli
              - ping 
          initialDelaySeconds: 5
          periodSeconds: 5
