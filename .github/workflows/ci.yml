name: Intelliserve CI

on:
  push:
    branches:
      - main
  pull_request:
      branches:
        - main
  workflow_dispatch:

jobs:
  api-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api-gateway/requirements.txt
      
      - name: Install dependencies 
        run: pip install -r services/api-gateway/requirements.txt

      - name: Run gateway tests
        run: python -m pytest tests/gateway_test/ -v 
  
  inference-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/inference-engine/requirements.txt
      
      - name: Install dependencies 
        run: pip install -r services/inference-engine/requirements.txt

      - name: Run inference tests
        run: python -m pytest tests/inference_test/ -v 

  intent-classifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/intent-classifier/requirements-inference.txt
      
      - name: Install dependencies 
        run: pip install -r services/intent-classifier/requirements-inference.txt

      - name: Run intent tests
        run: python -m pytest tests/intent_test/ -v 

  #create a job that build all the services to an image 
  build:
    runs-on: ubuntu-latest
    needs: #wait untill all threee test jobs pass, if it fail build wont run
      - api-gateway
      - inference-engine
      - intent-classifier
    steps:
      - name: Checkout repository #download the source code into github action runner
        uses: actions/checkout@v4

      - name: Set up Docker Buildx #enable docker builder to build the images
        uses: docker/setup-buildx-action@v3

      - name: Build API Gateway image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api-gateway
          push: false 
          tags: intelliserve-api-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Inference Engine image
        uses: docker/build-push-action@v6 
        with: 
          context: ./services/inference-engine
          push: false
          tags: intelliserve-inference-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max 

      - name: Download Intent Classifier model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -U huggingface_hub
          hf download adejene/intelliserve-intent-classifier \
            --local-dir services/intent-classifier/models/intent-classifier \
            --token "$HF_TOKEN"
      - name: Build Intent Classifier image
        uses: docker/build-push-action@v6
        with:
          context: ./services/intent-classifier
          push: false
          tags: intelliserve-intent-classifier:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
